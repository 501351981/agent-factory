[project]
name = "agent-factory-demo-bridge"
version = "0.1.0"
description = "Agent工厂本地 Bridge 示例"
requires-python = ">=3.10"
dependencies = [
  "websockets>=13.0",
]

[project.scripts]
demo-bridge = "demo_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_bridge"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
