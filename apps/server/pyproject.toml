[project]
name = "agent-factory-server"
version = "0.1.0"
description = "Agent工厂底座服务"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0.0",
  "greenlet>=3.0.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9.0",
  "cryptography>=50.0.2",
]

[project.scripts]
agent-factory-server = "agent_factory_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory_server"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

